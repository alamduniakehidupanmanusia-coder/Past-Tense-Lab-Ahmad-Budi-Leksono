const CASEY="Casey Jones (1863–1900) was an American railway driver. He became a hero when he died because he saved the lives of many passengers in a terrible accident. On 30 April 1900 Casey was driving his train back to the station during a dark and wet night. He was with another driver, his friend Webb. The train was going fast because Casey wanted to get back quickly but this wasn't the problem. There was another train on the same railway. Casey and Webb didn't know about this train. As Casey was coming around a bend, he saw the other train. Casey realised the danger. 'Jump!' he shouted to his friend. Webb jumped from the train while Casey was trying to stop. Webb fell 100 metres but he didn't die. While he was falling, he heard Casey. Casey was shouting, 'Help!' The train was going fast, so it couldn't stop quickly. Casey slowed the train down but it still crashed. Casey was killed but the passengers didn't die. Casey became very famous after this and his friend wrote a very popular song, The Ballad of Casey Jones, about him.";
const RULES=["Past simple: add -ed to regular verbs; negative = did not + infinitive; question = Did + subject + infinitive. Many verbs are irregular (go → went, see → saw, be → was/were).","Use the past simple for past actions, states and facts, and for repeated or usual actions.","Past continuous: was/were + verb-ing. Use it for events in progress at a particular time, for simultaneous ongoing situations, and to give the reason for a past event or set the background of a story.","A shorter past simple event interrupts a longer past continuous one: My dad phoned while I was having a shower.","While goes before the past continuous; when goes before the past simple or the past continuous. Use when to join consecutive past simple events and with states (ages).","As describes two short events happening together: As the train crashed, everyone screamed.","Use during to say when something happened; use for to say how long it went on."];
const DK="Dick Whittington (1358–1423) was a famous mayor of London. The story says that Dick was a poor boy who (1) to London to become rich. Dick (2) his cat with him for company. Life was very hard in London. Dick worked as a servant (3) some months but he got very little money and all he had was his cat. Finally, Dick decided to give his cat to a merchant and leave London. As he (4) down the street, he (5) a voice in his head. The voice said, 'Come back, Dick, you will be Mayor of London three times!' Dick came back. At the same time, the merchant and his men (6) by ship to another country. It was a good ship but there was a big problem: rats! Rats (7) everywhere on the ship and no one (8) them. Luckily, Dick's cat was very good at catching rats. The merchant was very happy with the cat and gave Dick a nice present when he (9) home. Dick now had some money and he started his own business. He also married a rich woman. Dick (10) mayor of London three times and (11) he died he left a lot of money. The story does not say what (12) to his cat.";
const D=[
{t:"A — Past Simple Forms",ty:1,it:[["do","did"],["have","had"],["get","got"],["open","opened"],["eat","ate"],["swim","swam"],["shout","shouted"],["fall","fell"],["try","tried"],["know","knew"],["become","became"]]},
{t:"B — Past Continuous",it:[["The baby _____ very loudly, so I couldn't hear.","was crying|cried|were crying"],["_____ you _____ TV all night?","Were / watching|Did / watched|Was / watching"],["I couldn't call you because our phone _____.","wasn't working|weren't working|isn't working"],["While we _____ for the bus, it started to rain.","were waiting|waited|was waiting"],["_____ John _____ in London when you met him?","Was / living|Did / live|Were / living"],["My mum and dad _____ a coffee in the kitchen.","were having|was having|had"],["It _____ but it was very cold.","wasn't snowing|didn't snow|weren't snowing"],["Did it really happen or _____ I only _____?","was / dreaming|did / dream|were / dreaming"],["Glenn and Kirsten _____ in the game last Saturday.","weren't playing|wasn't playing|didn't playing"]]},
{t:"C — Match the Pairs",it:[["When I got home, …","I made dinner.|I was making dinner."],["The bottle smashed …","as it fell on the floor.|while it was falling on the floor."],["After the teacher finished, …","the students asked some questions.|the students were asking some questions."],["What music did you like …","when you were 11 years old?|while you were 11 years old?"],["I wasn't working …","for two years.|during two years."],["Clare was working in Oxford …","while Mike was studying at night school.|as Mike studied at night school."],["We started …","when everything was ready.|while everything was ready."],["Was Susan wearing the same dress …","when she came in?|when she was coming in?"]]},
{t:"F — Dick Whittington",ns:1,p:DK,it:[["Blank 1","came|was coming|has come|comes"],["Blank 2","took|was taking|were taking|taken"],["Blank 3","for|during|in|at"],["Blank 4","was walking|walks|is walking|has walked"],["Blank 5","heard|hear|was hearing|were hearing"],["Blank 6","was travelling|travels|travelled|were travelling"],["Blank 7","were running|is running|are running|was running"],["Blank 8","didn't catch|has caught|could catch|did catch"],["Blank 9","got|get|gotten|was getting"],["Blank 10","became|become|was becoming|did becoming"],["Blank 11","when|as|while|since"],["Blank 12","happened|happens|did happen|was happening"]]},
{t:"Reading & My Test",p:CASEY,it:[["Casey is a hero because he _____.","saved many lives|wrote a song"],["Webb was a _____.","driver|passenger"],["_____ the train stopped, all the passengers got off.","When|While|As"],["I didn't interrupt Casey because he _____ to Webb.","was speaking|spoke|were speaking"],["Webb was a driver _____ a long time.","for|during|since"],["What _____ Casey's wife _____ when she heard the news?","did … say|was … saying|has … said"],["Casey's friend never _____ by train again.","travelled|didn't travel|was travelling"]]}];
const N=D.length,S={lang:"id",theme:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark",view:0,auth:false,locked:false,id:null,end:0,done:false,b:[],a:[],ch:[],sc:[],err:""};

function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const nv=[t("nav")[0],t("nav")[1],...D.map(d=>d.t),t("nav")[2]],ic=["🪪","📘","✍️","⏳","🔗","🏰","🎯","🏅"],L=nv.length-1;
$("#side").innerHTML=`<div class="logo">PAST TENSE LAB</div>`+nv.map((n,i)=>`<button class="nav ${S.view===i?"on":""}" data-v="${i}">${ic[i]} ${n}${i>1&&i<L&&S.sc[i-2]>=80?" ✔":""}</button>`).join("")+`<div class="by">${t("by")}<br><b>Ahmad Budi Leksono</b></div>`;
const m=$("#main");
if(S.view>0&&!S.id){m.innerHTML=`<div class="card"><h1>${nv[S.view]}</h1><p class="mu">${t("fill")}</p></div>`;return}
if(S.view===0)m.innerHTML=`<div class="card"><h1>${t("idt")}</h1><p class="mu">${t("idm")}</p><div class="grid"><div><label>${t("nm")}</label><input id="f0" autocomplete="off" value="${esc(S.id?.n||"")}"></div><div><label>${t("cl")}</label><input id="f1" autocomplete="off" value="${esc(S.id?.c||"")}"></div><div><label>${t("no")}</label><input id="f2" inputmode="numeric" autocomplete="off" value="${esc(S.id?.p||"")}"></div><div><label>${t("ma")}</label><input id="f3" autocomplete="off" value="${esc(S.id?.m||"")}"></div></div><br><button class="p" id="go">${t("start")}</button><p class="log" id="lg">${S.id?t("ready")+" "+S.code:""}</p></div>`;
else if(S.view===1)m.innerHTML=`<div class="card"><h1>${t("mat")}</h1><h3>He was driving on a dark night.</h3><p class="txt">${esc(CASEY)}</p></div><div class="card"><h3>Grammar</h3>${RULES.map((r,i)=>`<p class="txt">${i+1}. ${esc(r)}</p>`).join("")}</div>`;
else if(S.view<L){const u=S.view-2,d=D[u],b=S.b[u],a=S.a[u],c=S.ch[u],dis=S.done||c?"disabled":"";
m.innerHTML=`<div class="card"><h1>${t("act")} ${d.t}</h1>${S.done?`<div class="over">${t("time")}</div>`:""}${d.p?`<p class="txt">${esc(d.p)}</p>`:""}</div><div class="card">${b.map((q,i)=>d.ty?`<div class="q">${i+1}. ${esc(q.q)}</div><input class="ty" data-t="${i}" placeholder="${t("ty")}" autocomplete="off" value="${esc(a[i]||"")}" ${dis}>${c?`<b class="${(a[i]||"").trim().toLowerCase()===q.a?"good":"bad"}"> ${(a[i]||"").trim().toLowerCase()===q.a?"✔":"✘ "+q.a}</b>`:""}<br>`:`<div class="q">${i+1}. ${esc(q.q)}</div><div class="opts">${q.o.map(o=>{let cl="o";if(c){if(o===q.a)cl+=" ok";else if(a[i]===o)cl+=" no"}else if(a[i]===o)cl+=" sel";return`<button class="${cl}" data-i="${i}" data-o="${esc(o)}" ${dis}>${esc(o)}</button>`}).join("")}</div>`).join("")}</div>${c?"":`<button class="p" data-c="${u}" ${S.done?"disabled":""}>${t("chk")}</button>`}${S.sc[u]!==null?`<div class="card" style="margin-top:14px"><div class="res ${S.sc[u]>=80?"good":"bad"}">${t("score")}: ${S.sc[u]}</div><p>${S.sc[u]>=80?t("pass"):t("fail")}</p>${S.done?"":`<button class="b" data-r="${u}">${t("retry")}</button>`} ${S.sc[u]>=80?`<button class="b" data-v="${L}">🏅 ${t("cert")}</button>`:""}</div>`:""}`}

x.strokeStyle="#ffc933";x.lineWidth=7;x.strokeRect(30,30,W-60,H-60);x.lineWidth=2;x.strokeRect(50,50,W-100,H-100);
x.textAlign="center";x.fillStyle="#ffe9a8";x.font="700 58px Georgia,serif";x.fillText("CERTIFICATE OF ACHIEVEMENT",W/2,170);
x.font="26px sans-serif";x.fillStyle="#ffc933";x.fillText("Past Tense Lab",W/2,220);

x.fillText("for successfully completing",W/2,520);
x.font="700 38px sans-serif";x.fillText(D[i].t,W/2,575,1000);
x.font="700 70px Georgia,serif";x.fillStyle="#ffd24a";x.fillText("Score: "+S.sc[i],W/2,670);
x.fillStyle="#bcd0ff";x.font="22px sans-serif";x.fillText(new Date().toLocaleDateString(S.lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"long",year:"numeric"}),W/2,740);
x.fillStyle="#fff";x.font="italic 24px Georgia,serif";x.fillText("Created by Ahmad Budi Leksono",W/2,785)}
function pad(n){return String(n).padStart(2,"0")}
function tick(){$("#clock").textContent=new Date().toLocaleTimeString(S.lang==="id"?"id-ID":"en-GB");
if(!S.id||S.done||S.locked)return;const l=Math.max(0,Math.ceil((S.end-Date.now())/1000));

if(l<=0){S.done=true;D.forEach((_,u)=>{if(!S.ch[u]){S.ch[u]=true;score(u)}});render()}}
